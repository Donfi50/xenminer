services:
  init-db:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: ["python", "init_db.py"]

  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - FLASK_APP=gpage.py
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
    command: ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && exec flask --app gpage run --host 0.0.0.0 --port 3000 --reload"]
    depends_on:
      init-db:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/difficulty').read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
